<!-- Favicon sizes and app icons beyond the one website.favicon emits.
     Written as root paths; Quarto rewrites them to page-relative ones
     (./logos/..., ../logos/...) at render, so they resolve at every depth. -->
<link rel="icon" type="image/png" sizes="32x32" href="/logos/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/logos/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/logos/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
