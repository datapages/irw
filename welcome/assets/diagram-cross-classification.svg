<svg viewBox="0 0 240 215" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <!-- grid: 4 columns x 4 rows, cell (col 2, row 1) highlighted -->
  <g>
    <rect x="60"  y="40"  width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="100" y="40"  width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="140" y="40"  width="40" height="40" fill="#2780e3" stroke="#2780e3" stroke-width="1.5"/>
    <rect x="180" y="40"  width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>

    <rect x="60"  y="80"  width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="100" y="80"  width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="140" y="80"  width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="180" y="80"  width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>

    <rect x="60"  y="120" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="100" y="120" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="140" y="120" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="180" y="120" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>

    <rect x="60"  y="160" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="100" y="160" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="140" y="160" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <rect x="180" y="160" width="40" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  </g>

  <!-- axis labels: id (row) and item (column) already used, untranslated, elsewhere on this page -->
  <text x="160" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#495057">item</text>
  <text x="30" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#495057">id</text>

  <!-- response value at the id/item intersection -->
  <text x="160" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">resp</text>
</svg>
