on:
  workflow_dispatch:
  # Checked every 3 hours, but rendered only when main has actually moved
  # since the last publish -- see the `decide` job. The render takes ~14
  # minutes and every publish adds a commit to gh-pages, so rebuilding an
  # unchanged site is not free; a check that finds nothing costs under a
  # minute, which is why checking often is cheap and rendering often is not.
  #
  # Every 3 hours (2026-09-19), not daily. The daily 14:30 cron was actually
  # starting at 17:20-19:30 UTC -- GitHub queues scheduled jobs -- so a merge
  # that just missed it waited ~27 hours. Minute 17 rather than :00 keeps off
  # the top-of-hour queue that caused that delay. Because a run only renders
  # after a change, ben-domingue/irw's weekly metadata pipeline (Mon 13:00)
  # and daily version manifest (13:30) are still picked up by the next check
  # after they land.
  schedule:
    - cron: "17 */3 * * *"

# One publish at a time. Two renders finishing together would race on
# gh-pages, and a manual dispatch can now easily land beside a scheduled run.
# Queued rather than cancelled: cancelling a render mid-publish could leave
# gh-pages half-written, and a queued run whose `decide` finds the site
# current skips in seconds anyway.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

name: Render and Publish

jobs:
  # Should the render run at all? A manual dispatch always renders -- if you
  # asked for it, you meant it. A scheduled run renders only if main carries
  # work that the last publish does not.
  #
  # The comparison is commit TIMESTAMPS, not SHAs, because gh-pages holds built
  # output and never shares a commit with main, so there is no SHA to compare
  # against. quarto publish commits to gh-pages at the END of a successful
  # render, so its commit is always later than the main commit it rendered:
  # gh-pages newer than main means the site is current.
  #
  # This deliberately watches THIS repository only, which is what makes it
  # cheap and predictable. It does NOT notice a new irw_meta release in the
  # warehouse -- the pages query Redivis live at render time, so a publish
  # there changes what the site would say without changing anything here. That
  # direction is covered by the daily drift report in ben-domingue/irw
  # (#1940), which reports when the warehouse has moved and the site has not.
  decide:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.check.outputs.render }}
    steps:
      - name: Compare main against the last publish
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch -- rendering."
            exit 0
          fi
          main_at="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" \
                       --jq '.commit.committer.date')"
          # A repository that has never published has no gh-pages branch yet.
          # Render in that case rather than skipping forever.
          if ! pages_at="$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" \
                             --jq '.commit.committer.date' 2>/dev/null)"; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "No gh-pages branch yet -- rendering."
            exit 0
          fi
          echo "main     last commit: $main_at"
          echo "gh-pages last commit: $pages_at"
          # Compare as epoch seconds. `[[ a > b ]]` on the ISO strings would
          # be a locale-collated comparison, which is a needless dependency on
          # the runner's LC_COLLATE for a question that is purely numeric.
          if [ "$(date -d "$main_at" +%s)" -gt "$(date -d "$pages_at" +%s)" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "main is ahead of the last publish -- rendering."
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Site is current -- skipping the render."
          fi

  build-deploy:
    needs: decide
    if: needs.decide.outputs.render == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install r-base-dev libcurl4-openssl-dev libudunits2-dev libgdal-dev libglpk-dev libgsl-dev cmake libx11-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2
        env:
          # Authenticate renv's GitHub downloads (redivis, irw) so they aren't
          # subject to the 60/hr unauthenticated, shared-runner-IP rate limit.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install irw
          pip install mirt girth scipy matplotlib pandas jupyter

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-scoped Redivis token. The render only reads (irw_meta and table
          # metadata for the landing pages); nothing here writes, so this secret
          # must not carry data.edit scope. If it is unset or empty the render
          # now FAILS rather than quietly publishing a site with no table landing
          # pages -- see landing/emit_landing_pages.R (ben-domingue/irw#2129).
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
