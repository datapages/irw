on:
  workflow_dispatch:
  # Checked every 3 hours, but rendered only when main or the released
  # irw_meta has moved since the last publish -- see the `decide` job. The render takes ~14
  # minutes, so rebuilding an unchanged site is not free; a check that finds nothing costs under a
  # minute, which is why checking often is cheap and rendering often is not.
  #
  # Every 3 hours (2026-09-19), not daily. The daily 14:30 cron was actually
  # starting at 17:20-19:30 UTC -- GitHub queues scheduled jobs -- so a merge
  # that just missed it waited ~27 hours. Minute 17 rather than :00 keeps off
  # the top-of-hour queue that caused that delay. A run renders after a change
  # to main or a new irw_meta release on Redivis (see `decide`), so a published
  # irw_meta reaches the site within about 3 hours with nobody dispatching.
  schedule:
    - cron: "17 */3 * * *"

# One publish at a time, so two deployments can't race and a manual dispatch
# landing beside a scheduled run just queues. Queued rather than cancelled: a
# queued run whose `decide` finds the site current skips in seconds anyway.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

# Deployed as a Pages artifact, not committed to a gh-pages branch
# (ben-domingue/irw#1719, 17.1). The branch kept every build: 264 of them came
# to ~270 MB, most of the repository's size, and grew with every publish. An
# artifact has no history. To roll back, re-run an earlier successful run.
permissions:
  contents: read
  pages: write
  id-token: write

name: Render and Publish

jobs:
  # Should the render run at all? A manual dispatch always renders -- if you
  # asked for it, you meant it. A scheduled run renders if either input the
  # site is built from has moved since the last publish:
  #
  # 1. THIS repository's main. "The last publish" is the newest SUCCESSFUL
  #    github-pages deployment, and its sha is the main commit it was built
  #    from. Render if that differs from main's head. (Under gh-pages this had
  #    to compare timestamps, because the branch held built output and shared
  #    no commit with main.)
  #
  # 2. The RELEASED irw_meta on Redivis (datapages/irw#404). The landing pages,
  #    collections and counts are read from irw_meta at render time, so a new
  #    release changes what the site should say without changing anything
  #    here; before this check a new table had no page until some unrelated
  #    commit landed or someone dispatched a render. The version the live site
  #    was built from is read back from its own llms.txt ("AS OF: ... · irw_meta
  #    vNN.0", written by landing/agent_guide_stamp.R, which in CI fails the
  #    render rather than leave it stale). The released version comes from the
  #    Redivis REST API, which answers anonymously for this public dataset, so
  #    no token is needed here. Render if the two differ.
  #
  # Check 2 fails SAFE: if either version cannot be read, it logs a warning
  # saying which and why, and the run decides on check 1 alone, exactly as
  # before. It never renders merely because a read failed, so an outage at
  # Redivis or a reworded stamp cannot turn the schedule into a render every 3
  # hours. Drift it misses is still reported daily by the drift report in
  # ben-domingue/irw (#1940).
  decide:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.check.outputs.render }}
    steps:
      - name: Compare main and irw_meta against the last publish
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          # Anonymous read of the released irw_meta, and the live site's stamp
          # of the irw_meta it was built from. Overridable only to test this
          # step locally.
          META_API: https://redivis.com/api/v1/datasets/datapages.irw_meta:bdxt
          STAMP_URL: https://itemresponsewarehouse.org/llms.txt
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch -- rendering."
            exit 0
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          # Newest deployment whose latest status is success. A failed or
          # in-flight deployment is not a publish. Legacy gh-pages builds also
          # show up here, with a gh-pages sha that never equals main's, so the
          # first scheduled run after the switch renders once, which is right.
          deployed_sha=""
          for id_sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" \
                            --jq '.[] | "\(.id):\(.sha)"'); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/${id_sha%%:*}/statuses?per_page=1" \
                       --jq '.[0].state // ""')"
            if [ "$state" = "success" ]; then deployed_sha="${id_sha#*:}"; break; fi
          done
          echo "main head        : $main_sha"
          echo "last deployed sha: ${deployed_sha:-(none)}"

          # irw_meta. Every read is allowed to fail; a failure leaves the
          # version empty and is reported, never acted on.
          vpat='^v[0-9]+\.[0-9]+$'
          released_meta=""
          if meta_json="$(curl -fsS -m 30 --retry 2 "$META_API" 2>&1)"; then
            released_meta="$(jq -r 'if .currentVersion.isReleased == true
                                    then .currentVersion.tag // "" else "" end' \
                               <<< "$meta_json" 2>/dev/null || true)"
            [[ "$released_meta" =~ $vpat ]] || {
              echo "::warning::irw_meta check skipped: the Redivis API answered but gave no released version tag (got '${released_meta}')."
              released_meta=""; }
          else
            echo "::warning::irw_meta check skipped: could not read $META_API (${meta_json:0:200})."
          fi
          deployed_meta=""
          if [ -n "$released_meta" ]; then
            # A throwaway query string so Pages' CDN cache (max-age 600) cannot
            # hand back the stamp from before a deploy that just finished.
            if stamp_txt="$(curl -fsS -m 30 --retry 2 "$STAMP_URL?decide=$(date +%s)" 2>&1)"; then
              deployed_meta="$(grep -m1 '^AS OF:' <<< "$stamp_txt" \
                                 | grep -oE 'irw_meta v[0-9]+\.[0-9]+' | cut -d' ' -f2 || true)"
              [[ "$deployed_meta" =~ $vpat ]] || {
                echo "::warning::irw_meta check skipped: no 'AS OF: ... irw_meta vNN.N' stamp in the live llms.txt (landing/agent_guide_stamp.R writes it)."
                deployed_meta=""; }
            else
              echo "::warning::irw_meta check skipped: could not read $STAMP_URL (${stamp_txt:0:200})."
            fi
          fi
          echo "released irw_meta: ${released_meta:-(unreadable)}"
          echo "deployed irw_meta: ${deployed_meta:-(unreadable)}"

          if [ "$main_sha" != "$deployed_sha" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "main differs from the last publish -- rendering."
          elif [ -n "$released_meta" ] && [ -n "$deployed_meta" ] \
               && [ "$released_meta" != "$deployed_meta" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "irw_meta $released_meta is released and the site was built from $deployed_meta -- rendering."
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Site is current -- skipping the render."
          fi

  # Render and deploy are separate jobs so a failed deploy can be re-run on its
  # own ("Re-run failed jobs") without another ~40-minute render: the uploaded
  # github-pages artifact belongs to the run and survives the re-run.
  build:
    needs: decide
    if: needs.decide.outputs.render == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: landing/write_sitemaps.R dates each page's sitemap
          # <lastmod> by the last commit to its source. In the default depth-1
          # clone every file's last commit is the same one, and it would omit
          # lastmod rather than publish that.
          fetch-depth: 0

      # No tracked file over 5 MB (ben-domingue/irw#1719, 17.1). A vignette
      # result that big goes to the `vignette-data` release and is fetched at
      # render time -- see CLAUDE.md, "Vignette compute pattern". Failing here
      # leaves the live site on its last good deployment.
      - name: Refuse tracked files over 5 MB
        run: |
          big="$(git ls-files -z | xargs -0 stat -c '%s %n' | awk '$1 > 5000000')"
          if [ -n "$big" ]; then
            echo "::error::Tracked files over 5 MB -- move them to the vignette-data release:"
            echo "$big"
            exit 1
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install r-base-dev libcurl4-openssl-dev libudunits2-dev libgdal-dev libglpk-dev libgsl-dev cmake libx11-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2
        env:
          # Authenticate renv's GitHub downloads (redivis, irw) so they aren't
          # subject to the 60/hr unauthenticated, shared-runner-IP rate limit.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install irw
          pip install mirt girth scipy matplotlib pandas jupyter

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-scoped Redivis token. The render only reads (irw_meta and table
          # metadata for the landing pages); nothing here writes, so this secret
          # must not carry data.edit scope. If it is unset or empty the render
          # now FAILS rather than quietly publishing a site with no table landing
          # pages -- see landing/emit_landing_pages.R (ben-domingue/irw#2129).
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}

      # _site/ carries CNAME (copied from the repo root), robots.txt, the
      # sitemap index (sitemap.xml -> sitemap-pages.xml, sitemap-tables.xml) and
      # the landing pages emitted by the post-render steps. The custom domain
      # itself is the Pages setting, not this file.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # deploy-pages can look up the artifact before GitHub lists it and fail with
  # 'No artifacts named "github-pages" were found' although the upload
  # finished (run 45732588869, 2026-11-26: the lookup came 0.3 s after the
  # upload was finalized). So the first attempt may fail, and a second runs
  # after a pause. A real failure fails the second attempt too.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
