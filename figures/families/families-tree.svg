  <rect x="128.0" y="141.0" width="52.0" height="11.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="154.0" y="149.5" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >one at a time</text>
  <rect x="230.0" y="141.0" width="52.0" height="11.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="256.0" y="149.5" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >two at a time</text>
  <rect x="308.0" y="141.0" width="50.0" height="11.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="333.0" y="149.5" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >all, in order</text>
  <rect x="104.0" y="166.0" width="46.0" height="30.0" rx="6" fill="#ffffff" stroke="#2469bc" stroke-width="1.8" />
  <text x="127.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#2469bc" >Core</text>
  <text x="127.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >ordered</text>
  <rect x="154.0" y="166.0" width="52.0" height="30.0" rx="6" fill="#ffffff" stroke="#8352ff" stroke-width="1.8" />
  <text x="180.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#8352ff" >Nominal</text>
  <text x="180.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >unordered</text>
  <rect x="214.0" y="166.0" width="84.0" height="30.0" rx="6" fill="#ffffff" stroke="#cc4814" stroke-width="1.8" />
  <text x="256.0" y="180.0" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#cc4814" >Competitions</text>
  <text x="256.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >pairs</text>
