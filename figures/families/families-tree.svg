<svg viewBox="0 0 372 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two questions that sort a dataset into an IRW family.">
  <text x="12.0" y="13.0" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="700" fill="#343a40" >Which family?</text>
  <text x="12.0" y="27.0" text-anchor="start" font-family="sans-serif" font-size="9.5" font-weight="normal" fill="#6c757d" >sort a new dataset with two questions</text>
  <rect x="86.0" y="40.0" width="200.0" height="30.0" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" />
  <text x="186.0" y="52.0" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="600" fill="#343a40" >Do the things responded to</text>
  <text x="186.0" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="600" fill="#343a40" >keep a stable identity?</text>
  <path d="M140,70 V83.0 H52 V96" fill="none" stroke="#adb5bd" stroke-width="1.3"/>
  <text x="92.0" y="80.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >no</text>
  <rect x="12.0" y="96.0" width="80.0" height="30.0" rx="6" fill="#ffffff" stroke="#127350" stroke-width="1.8" />
  <text x="52.0" y="110.0" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#127350" >Conjoint</text>
  <text x="52.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >built from attributes</text>
  <path d="M232,70 V83.0 H270 V96" fill="none" stroke="#adb5bd" stroke-width="1.3"/>
  <text x="254.0" y="80.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="normal" fill="#6c757d" >yes</text>
  <rect x="196.0" y="96.0" width="148.0" height="30.0" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" />
  <text x="270.0" y="108.0" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="600" fill="#343a40" >How does a person</text>
  <text x="270.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="600" fill="#343a40" >meet them?</text>
  <path d="M270,126 V134" fill="none" stroke="#adb5bd" stroke-width="1.3"/>
  <path d="M154,134 H333" fill="none" stroke="#adb5bd" stroke-width="1.3"/>
